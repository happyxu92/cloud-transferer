[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-transferer"
version = "0.1.0"
description = "Baidu Netdisk -> Quark Netdisk auto migration via AList"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "sqlmodel>=0.0.16",
    "apscheduler>=3.10",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "loguru>=0.7",
    "typer>=0.12",
    "rich>=13.7",
    "tenacity>=8.2",
]

[project.scripts]
ct = "cloud_transferer.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
